# Minimal Nginx configuration for VodaEHRs
# This config proxies requests to the backend service and provides a health check.

events {}

http {
  include       mime.types;
  default_type  application/octet-stream;

  server {
    listen 80;
    server_name _;

    # Proxy all API requests to the backend (adjust the upstream as needed)
    location /api/ {
      proxy_pass http://backend:8000;  # Assuming the backend service is reachable via this hostname
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files (if any) from /usr/share/nginx/html (default)
    location / {
      try_files $uri $uri/ =404;
    }

    # Simple health check endpoint
    location /health {
      return 200 "OK";
    }
  }
}
